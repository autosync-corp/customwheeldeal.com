        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Common signs include your vehicle pulling to one side, a crooked steering wheel when driving straight, uneven or rapid tire wear on inside or outside edges, and squealing tires during turns."
        }
      },
      {
        "@type": "Question",
        "name": "Will the alignment machine scratch my rims?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Our Hunter HawkEye Elite® system uses target adapters that grip the tire tread, not the rim, so there is zero metal-on-metal contact and no risk of damage to alloy or custom wheels."
        }
      },
      {
        "@type": "Question",
        "name": "How often should I get a wheel alignment?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We recommend a wheel alignment check once a year or any time you install new tires, hit a significant pothole, or notice any of the warning signs such as pulling or uneven tire wear."
        }
      },
      {
        "@type": "Question",
        "name": "Does wheel alignment improve fuel economy?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Misaligned wheels create extra rolling resistance, forcing your engine to work harder. Correcting alignment reduces that drag, which lowers fuel consumption."
        }
      }
    ]
  }
