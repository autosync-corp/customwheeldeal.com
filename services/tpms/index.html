    "mainEntity": [
      {
        "@type": "Question",
        "name": "Why is my TPMS light on after adding air?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "If the TPMS light stays on after you've inflated your tires to the correct pressure, the system needs a professional reset. After adding air, you may need to drive for a few miles for the sensors to update, or the sensors may need to be relearned to your vehicle's computer."
        }
      },
      {
        "@type": "Question",
        "name": "What does a flashing TPMS light mean?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A TPMS light that flashes for about 60 seconds when you start your vehicle and then stays solid indicates a system malfunction — typically a dead sensor battery or a failed sensor. This is different from a solid light, which simply means low tire pressure."
        }
      },
      {
        "@type": "Question",
        "name": "How long do TPMS sensors last?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "TPMS sensor batteries typically last between 5 and 10 years, or around 100,000 miles. Because the battery is sealed inside the sensor, it cannot be replaced separately — the entire sensor must be replaced when the battery dies."
        }
      },
      {
        "@type": "Question",
        "name": "Do I need a TPMS reset after a tire rotation?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. After a tire rotation, the sensors move to new wheel positions and your vehicle's computer needs to be updated to match. We perform a full OBD-II relearn to sync your sensors to your dashboard so the correct tire position is always displayed."
        }
      },
      {
        "@type": "Question",
        "name": "Is it safe to drive with the TPMS light on?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A malfunctioning TPMS means you won't receive a warning if you suffer a sudden pressure loss while driving. We recommend getting it diagnosed promptly, as driving on an underinflated tire can cause a blowout and significant wheel damage."
        }
      }
    ]
  }
